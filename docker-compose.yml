services:
  label-bench:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8013:8013"

    environment:
      PRINTER_MODEL: "QL-800"
      # Friendly name shown in the UI (tab title, sidebar, status).
      PRINTER_DISPLAY_NAME: "Brother QL-800"
      # Printer connection. USB: "usb://0x04f9:0x209b"
      # Wi-Fi (QL-810W/QL-820NWB): "tcp://PRINTER_IP:9100"
      # The Printer panel in the UI can override this at runtime.
      PRINTER: "usb://0x04f9:0x209b"
      DEFAULT_LABEL_SIZE: "62"
      PORT: "8013"
      SERIAL_DB: "/app/data/label_serials.db"
      # --- Printer resilience (see PRINTER_TROUBLESHOOTING.md) ---
      # Attempts per print job on the primary URI (progressive backoff).
      PRINT_MAX_RETRIES: "5"
      # Base delay (s) between attempts; grows ~50% per attempt.
      PRINT_RETRY_DELAY: "2.5"
      # Settle time (s) after waking an autosuspended device.
      PRINT_WAKE_WAIT: "1.5"
      # Seconds to wait for the printer's completion status reply.
      PRINT_STATUS_TIMEOUT: "10"
      # Auto-fallback between usb:// and file:///dev/usb/lp* backends.
      PRINTER_AUTO_FALLBACK: "1"
      # Extra fallback URIs (comma-separated), e.g. "file:///dev/usb/lp0".
      PRINTER_FALLBACKS: ""

    # Dynamic USB and device passthrough via volume bind mounts:
    # 1. /dev/bus/usb: Live bind mount ensures that when the printer sleeps,
    #    autosuspends, or is re-plugged, the new minor device node on the host
    #    is IMMEDIATELY visible inside the container without container recreation.
    # 2. /dev: Dynamically maps newly created /dev/usb/lp* nodes when the kernel
    #    usblp driver claims the printer.
    # 3. /run/udev: Live udev database access for libusb device enumeration.
    # 4. /sys: Allows the container to disable OS USB autosuspend automatically.
    volumes:
      - ./data:/app/data
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /sys:/sys

    # Required: brother_ql calls detach_kernel_driver() to pry the
    # interface away from the Linux usblp kernel driver. That needs
    # CAP_SYS_ADMIN, which privileged mode grants.
    privileged: true

    restart: unless-stopped

    labels:
      - "autoheal=true"

  # Auto-heal service: monitors container health checks and automatically
  # restarts the service if it ever hangs or becomes unresponsive,
  # eliminating the need for manual restarts or rebuilds.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: label-bench-autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: none
